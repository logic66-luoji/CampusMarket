<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1400" height="920" fill="#ffffff"/>
  <text x="700" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#1a202c">Figure 2 — CampusMarket ER Diagram</text>
  <text x="700" y="76" text-anchor="middle" font-size="15" fill="#4a5568">crow's-foot cardinalities · ON DELETE actions shown on each relationship · transaction state carried by products</text>

  <!-- ───── users entity ───── -->
  <rect x="90" y="130" width="360" height="216" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
  <rect x="90" y="130" width="360" height="40" rx="8" fill="#2B6CB0"/>
  <rect x="90" y="158" width="360" height="12" fill="#2B6CB0"/>
  <text x="270" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">users</text>
  <g font-size="14" fill="#1a202c">
    <text x="106" y="192" font-weight="700">user_id</text><text x="434" y="192" text-anchor="end" fill="#6f7578">PK, AUTOINCREMENT</text>
    <text x="106" y="216">username</text><text x="434" y="216" text-anchor="end" fill="#6f7578">NOT NULL, UNIQUE</text>
    <text x="106" y="240">password_hash</text><text x="434" y="240" text-anchor="end" fill="#6f7578">NOT NULL (SHA-256)</text>
    <text x="106" y="264">email</text><text x="434" y="264" text-anchor="end" fill="#6f7578">UNIQUE</text>
    <text x="106" y="288">created_at</text><text x="434" y="288" text-anchor="end" fill="#6f7578">DEFAULT CURRENT_TIMESTAMP</text>
  </g>
  <line x1="90" y1="176" x2="450" y2="176" stroke="#2B6CB0" stroke-width="1"/>

  <!-- ───── categories entity ───── -->
  <rect x="950" y="150" width="360" height="146" rx="8" fill="#ffffff" stroke="#2F855A" stroke-width="2"/>
  <rect x="950" y="150" width="360" height="40" rx="8" fill="#2F855A"/>
  <rect x="950" y="178" width="360" height="12" fill="#2F855A"/>
  <text x="1130" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">categories</text>
  <g font-size="14" fill="#1a202c">
    <text x="966" y="212" font-weight="700">category_id</text><text x="1294" y="212" text-anchor="end" fill="#6f7578">PK, AUTOINCREMENT</text>
    <text x="966" y="236">name</text><text x="1294" y="236" text-anchor="end" fill="#6f7578">NOT NULL, UNIQUE</text>
    <text x="966" y="260" fill="#6f7578" font-size="12">5 rows (Chinese category names)</text>
  </g>
  <line x1="950" y1="196" x2="1310" y2="196" stroke="#2F855A" stroke-width="1"/>

  <!-- ───── products entity ───── -->
  <rect x="420" y="440" width="560" height="380" rx="8" fill="#ffffff" stroke="#C05621" stroke-width="2"/>
  <rect x="420" y="440" width="560" height="40" rx="8" fill="#C05621"/>
  <rect x="420" y="468" width="560" height="12" fill="#C05621"/>
  <text x="700" y="467" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">products</text>
  <g font-size="14" fill="#1a202c">
    <text x="436" y="502" font-weight="700">product_id</text><text x="964" y="502" text-anchor="end" fill="#6f7578">PK, AUTOINCREMENT</text>
    <text x="436" y="526">seller_id</text><text x="964" y="526" text-anchor="end" fill="#6f7578">FK → users, NOT NULL</text>
    <text x="436" y="550">buyer_id</text><text x="964" y="550" text-anchor="end" fill="#6f7578">FK → users, NULL (unsold)</text>
    <text x="436" y="574">category_id</text><text x="964" y="574" text-anchor="end" fill="#6f7578">FK → categories, NOT NULL</text>
    <text x="436" y="598">title</text><text x="964" y="598" text-anchor="end" fill="#6f7578">VARCHAR(100), NOT NULL</text>
    <text x="436" y="622">description</text><text x="964" y="622" text-anchor="end" fill="#6f7578">TEXT</text>
    <text x="436" y="646">price</text><text x="964" y="646" text-anchor="end" fill="#6f7578">CHECK (price &gt;= 0)</text>
    <text x="436" y="670">status</text><text x="964" y="670" text-anchor="end" fill="#6f7578">CHECK (available | sold), DEFAULT available</text>
    <text x="436" y="694">image_url</text><text x="964" y="694" text-anchor="end" fill="#6f7578">reserved</text>
    <text x="436" y="718">created_at</text><text x="964" y="718" text-anchor="end" fill="#6f7578">DEFAULT CURRENT_TIMESTAMP</text>
    <text x="436" y="742">finished_at</text><text x="964" y="742" text-anchor="end" fill="#6f7578">NULL (unsold)</text>
    <text x="436" y="778" font-weight="700" fill="#C05621">transaction state on this row:</text>
    <text x="436" y="800" fill="#6f7578">purchase = conditional UPDATE of buyer_id / status / finished_at</text>
  </g>
  <line x1="420" y1="486" x2="980" y2="486" stroke="#C05621" stroke-width="1"/>

  <!-- ───── relationship: users 1..* products (seller) ───── -->
  <path d="M 450 200 L 640 200 L 640 436" fill="none" stroke="#1a202c" stroke-width="2"/>
  <text x="468" y="192" font-size="15" font-weight="700" fill="#1a202c">1</text>
  <text x="590" y="192" font-size="15" fill="#4a5568">publishes</text>
  <text x="648" y="430" font-size="15" font-weight="700" fill="#1a202c">*</text>
  <text x="470" y="248" font-size="13" fill="#6f7578">seller_id · ON DELETE CASCADE</text>

  <!-- ───── relationship: users 1..0..1 products (buyer) ───── -->
  <path d="M 270 346 L 270 392 L 420 392 L 420 436" fill="none" stroke="#1a202c" stroke-width="2"/>
  <text x="278" y="368" font-size="15" font-weight="700" fill="#1a202c">1</text>
  <text x="300" y="386" font-size="15" fill="#4a5568">purchases (0..1 per product)</text>
  <text x="428" y="430" font-size="15" font-weight="700" fill="#1a202c">*</text>
  <text x="252" y="416" font-size="13" fill="#6f7578">buyer_id · ON DELETE SET NULL</text>

  <!-- ───── relationship: categories 1..* products ───── -->
  <path d="M 1130 296 L 1130 380 L 980 380 L 980 436" fill="none" stroke="#1a202c" stroke-width="2"/>
  <text x="1138" y="322" font-size="15" font-weight="700" fill="#1a202c">1</text>
  <text x="1052" y="372" font-size="15" fill="#4a5568">belongs to</text>
  <text x="988" y="430" font-size="15" font-weight="700" fill="#1a202c">*</text>
  <text x="1148" y="342" font-size="13" fill="#6f7578">category_id · ON DELETE RESTRICT</text>
</svg>
